</head>

<body>
    <script>
        function arraySwap(array) {
            let i = array.length
            let lastIndex = i - 1;
            let firstIndex = i;
            lastIndex = firstIndex
            firstIndex = lastIndex
            return i
        }
        console.log(arraySwap([1, 2, 3]));

    </script>
</body>
