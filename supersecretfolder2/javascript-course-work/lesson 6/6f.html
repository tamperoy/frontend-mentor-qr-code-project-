<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6f</title>
</head>

<body>
    <script>
        const randomNumber = Math.random()

        let result = '';

        if (randomNumber < 0.5) {
            result = 'Heads'
        }

        else {
            result = 'Tails'
        }

        console.log(result);


        const guess = 'Heads';

        if (result === guess) {
            console.log('You win!');
        }
        else if (result != guess) {
            console.log('You lose!');
        }
    </script>
</body>

</html>
