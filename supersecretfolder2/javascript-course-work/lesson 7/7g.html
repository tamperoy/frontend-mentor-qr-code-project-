<body>
    <script>

        //use if once and then use else if use if multiple times only if its searching for multiple things
        function convertLength(length, from, to) {
            if (from === 'miles' && to === 'km') {
                const mile = (length * 1.6)
                console.log(mile);
            }

            else if (from === 'km' && to === 'miles') {
                const kilometer = (length / 1.60)
                console.log(kilometer);
            }

            else if (from === 'miles' && to === 'ft') {
                const feet = (length * 5280)
                console.log(feet);
            }


            else if (from === 'ft' && to === 'miles') {
                const feet = (length / 5280)
                console.log(feet);
            }


            else if (from === 'km' && to === 'ft') {
                const feet = (length * 3281)
                console.log(feet);
            }

            else {
                const unit = from && to
                console.log(`invalid unit:${unit}`);
            }
        }


        /* convertLength(50, 'miles', 'km');
        convertLength(32, 'km', 'miles'); */

        /*  convertLength(5, 'miles', 'km');
         convertLength(5, 'miles', 'ft');
         convertLength(5, 'km', 'ft'); */

        convertLength(5, 'lbs', 'lbs')

    </script>
