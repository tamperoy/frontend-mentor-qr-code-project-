<body>

    <script>


        function greet(name) {

            if (name === undefined) {
                console.log('Hi there');
                return
            }

            console.log(`Hello ${name}!`);
        }

        greet('Majid');
        greet('Simon');
        greet('Harry');
        greet('Marian');
    </script>
</body>
