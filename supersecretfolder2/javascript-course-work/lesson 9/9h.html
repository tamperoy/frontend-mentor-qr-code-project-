<!DOCTYPE html>
<html lang="en">

<head>
    <title>9h</title>
</head>

<body>
    <input placeholder="input" class="js-input" onkeyup="
       morphingText();
        ">
    <p class="text"></p>
    <script>
        function morphingText() {
            const input = document.querySelector('.js-input').value

            document.querySelector('.text')
                .innerHTML = input
        }
    </script>
</body>

</html>
