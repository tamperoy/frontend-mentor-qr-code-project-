<!DOCTYPE html>
<html lang="en">

<head>
    <title>9d</title>
</head>

<body>
    <input placeholder="Name" class="js-input" onkeydown="
    handleCostKeydown(event);
    ">

    <button onclick="
    nameFunction();
    ">
        Submit
    </button>

    <p class="outcome"></p>

    <script>
        function nameFunction() {
            const name = document.querySelector('.js-input').value

            let result = document.querySelector('.outcome')
                .innerHTML = `your name is ${name}`;
        }

        function handleCostKeydown(event) {
            if (event.key === 'Enter') {
                nameFunction();
            }
        }
    </script>
</body>

</html>
