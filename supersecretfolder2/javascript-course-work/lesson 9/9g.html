<!DOCTYPE html>
<html lang="en">

<head>
    <title>9g</title>
</head>

<body>
    <input placeholder="cost" class="js-cost-input" onkeydown="
    handleCostKeydown(event);
    ">

    <button onclick="
    calculateTotal();
    ">Calculate</button>
    <p class="js-total-cost"></p>

    <script>
        function calculateTotal() {
            const inputElement = document.querySelector('.js-cost-input');
            let cost = Number(inputElement.value);


            if (cost < 40) {
                cost = cost + 10
            }

            document.querySelector('.js-total-cost')
                .innerHTML = `$${Math.round(cost)}`
        }

        function handleCostKeydown(event) {
            if (event.key === 'Enter') {
                calculateTotal();
            }
        }
    </script>
</body>

</html>
