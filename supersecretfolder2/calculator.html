<!DOCTYPE html>
<html>

<head></head>

<body>
    <p>
        <button onclick="
        calculation ++;
        ">1</button>

        <button onclick="
        calculation +=2;
        ">2</button>

        <button onclick="
        calculation +=3;
        ">3</button>
    </p>

    <p>
        <button onclick="
        calculation +=4;
        ">4</button>

        <button onclick="
        calculation +=5;
        ">5</button>

        <button onclick="
        calculation +=6;
        ">6</button>
    </p>

    <p>
        <button onclick="
        calculation +=7;
        ">7</button>

        <button onclick="
        calculation +=8;
        ">8</button>

        <button onclick="
        calculation +=9;
        ">9</button>
    </p>

    <p>
        <button onclick="
        calculation +=' + ';
        ">+</button>
        <button onclick="
        calculation +=' - ';
        ">-</button>
        <button onclick="
        calculation=eval(calculation);
        console.log(calculation);
        ">=</button>
    </p>

    <script>
        let calculation = '';
    </script>
</body>

</html>
